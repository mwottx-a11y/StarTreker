<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <!-- "Add to Home Screen" launches full-screen, without browser chrome -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Star Treker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Star Treker: Voyages of the Meridian</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
      /* no pull-to-refresh, rubber-banding, double-tap zoom, text selection or tap flash */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { height: 100dvh; }
    #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

    /* The game is a 16:10 landscape layout. On phones held upright it would
       shrink to ~60% size, so ask the player to rotate instead. */
    #rotate { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate {
        display: flex; position: fixed; inset: 0; z-index: 10; background: #000;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        color: #f0a040; font: 14px/1.8 "Press Start 2P", monospace; text-align: center; padding: 24px;
      }
      #rotate .phone {
        width: 44px; height: 76px; border: 4px solid #9a8ad0; border-radius: 8px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="phone"></div><div>ROTATE YOUR DEVICE<br /><span style="color:#8890a0;font-size:10px">THE MERIDIAN FLIES IN LANDSCAPE</span></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
